<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เจ้าหน้าที่ | โดมนี้เพื่อน้อง</title><link rel="stylesheet" href="style.css"><header><strong>โรงเรียนสยามกลการ 4</strong><a class="staff-link" href="./">กลับหน้าสั่งจอง</a></header><main class="workspace"><section id="signin"><h1>เข้าสู่ระบบเจ้าหน้าที่</h1><form id="login"><label>ชื่อผู้ใช้ (Username)<input name="user" autocomplete="username" required></label><label>รหัสผ่าน (Password)<input name="password" type="password" autocomplete="current-password" required></label><button class="btn">เข้าสู่ระบบ</button></form></section><p id="status" role="status"></p><div id="panel" hidden><button id="logout">ออกจากระบบ</button><h1>ศูนย์จัดการใบจอง</h1><div id="metrics"></div><div class="switch"><button data-page="queue">รายการจอง</button><button data-page="report">ยอดตามไซส์</button><button data-page="order">รับเงินสด</button></div><section id="queue"><h2>ทะเบียนการจอง</h2><div class="filters"><label>ค้นหาผู้จอง<input id="search" placeholder="ชื่อ เบอร์โทร หรือรหัสใบจอง"></label><label>สถานะ<select id="filter"><option value="">ทุกสถานะ</option><option>รอตรวจสอบ</option><option>ต้องแก้ไข</option><option>ชำระแล้ว</option></select></label><button id="refresh">โหลดรายการใหม่</button></div><div id="bookings"></div></section><section id="report" hidden><h2>ยอดเสื้อตามไซส์</h2><table><thead><tr><th>ไซส์</th><th>ชำระแล้ว</th><th>รอตรวจ/แก้ไข</th></tr></thead><tbody id="totals"></tbody></table><p><a id="sheet" target="_blank" rel="noopener">เปิด Google Sheets ↗</a></p></section><form id="order" hidden><h2>บันทึกรับเงินสด</h2><div class="grid"><section><h3>ข้อมูลผู้จอง</h3><label>ชื่อ–นามสกุล<input name="customer" required maxlength="120" autocomplete="name"></label><label>เบอร์ติดต่อ<input name="phone" type="tel" required pattern="[0-9]{9,10}" autocomplete="tel"></label>
<h3>รายการเสื้อ</h3><div id="items"></div><button type="button" id="add">+ เพิ่มรายการเสื้อ</button>
<h3>วิธีรับเสื้อ</h3><label><select name="delivery"><option value="pickup">รับที่โรงเรียน · ฟรี</option><option value="mail">ส่งไปรษณีย์ · 50 บาทต่อตัว</option></select></label><label id="addr" hidden>ที่อยู่จัดส่งพร้อมรหัสไปรษณีย์<textarea name="address" maxlength="600"></textarea></label></section>
<section><h3>สรุปยอดใบจอง</h3><p id="bill" aria-live="polite"></p><label>จำนวนเงินสดที่รับ (บาท)<input name="amount" type="number" min=".01" step=".01" required></label><label>วันและเวลารับเงิน (เวลาไทย)<input name="paidAt" type="datetime-local" required></label><button class="btn" id="send" disabled>บันทึกรับเงินสด</button><p id="msg" role="status"></p></section></div></form>
</div></main><footer><strong>โรงเรียนสยามกลการ 4</strong><div>ผู้รับผิดชอบโครงการ<br><span id="owner"></span></div><div>เจ้าหน้าที่ผู้พัฒนาเว็บไซต์<br><span id="developer"></span></div></footer><script src="qr.js"></script><script src="interaction.js"></script><script src="config.js"></script><script src="footer.js"></script><script src="staff.js"></script></html>
